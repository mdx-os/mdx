[package]
name = "mdx-server"
version = "0.1.0"
description = "Local CLI and HTTP surfaces for MDx Native activation."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
mdx-core = { path = "../mdx-core" }
mdx-observability = { path = "../mdx-observability" }
mdx-mobile-relay = { path = "../mdx-mobile-relay" }
base64 = "0.23"
aws-config = "1.9.0"
aws-sdk-bedrockagentcore = { version = "1.52.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.138.1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.3.4"
liteparse = { version = "2.1.1", default-features = false }
ppt-rs = "0.2.19"
redis = "1.6"
rust_xlsxwriter = "0.99.0"
zip = { version = "8.6", default-features = false }
# Live model gateway (provider-connected local): minimal sync HTTPS client
# + JSON for provider responses. The kernel itself never opens the network.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt", "time"] }
ureq = { version = "3", features = ["json"] }
url = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
# Trusted-session verifier crypto: HS256 for local-secure signed test tokens and
# RS256/JWKS for production OIDC. mdx-core stays dependency-free; the concrete
# verifiers live here. Same major version the message relay already uses.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
jsonschema = { version = "0.49", default-features = false }
postgres = "0.19"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
ring = "0.17"
minicbor = { version = "2.3.0", features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103.13", default-features = false, features = ["alloc", "ring"] }
# Shutdown durability: block SIGTERM/SIGINT and sigwait on a dedicated thread so
# a graceful stop runs one final snapshot flush before exit. Already in the tree
# transitively; declared direct here for the signal FFI.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Native Keychain calls keep provider credentials out of process arguments.
security-framework = "3.7"

[[bin]]
name = "mdx-server"
path = "src/main.rs"
