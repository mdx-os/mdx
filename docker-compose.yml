services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mdx
      POSTGRES_PASSWORD: mdx
      POSTGRES_DB: mdx
    ports:
      - "${MDX_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdx -d mdx"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "${MDX_VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
