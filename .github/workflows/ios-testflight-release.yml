name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, for example 0.9.2
        required: true
        type: string
      build:
        description: Numeric build identifier, defaults to the workflow run number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-testflight-release
    env:
      MDX_IOS_MARKETING_VERSION: ${{ inputs.version }}
      MDX_IOS_BUILD_NUMBER: ${{ inputs.build || github.run_number }}
      MDX_APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_IOS_TEAM_ID }}
      MDX_SUPABASE_URL: ${{ vars.MDX_SUPABASE_URL }}
      MDX_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MDX_SUPABASE_PUBLISHABLE_KEY }}
      MDX_PUBLIC_HOST_URL: ${{ vars.MDX_PUBLIC_HOST_URL }}
      MDX_TESTFLIGHT_UPLOAD: "1"
      MDX_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
      MDX_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Install XcodeGen when absent
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Validate release inputs
        run: |
          [[ "$MDX_IOS_MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MDX_IOS_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          : "${MDX_APPLE_DEVELOPMENT_TEAM:?GitHub environment variable is required}"
          : "${MDX_SUPABASE_URL:?GitHub environment variable is required}"
          : "${MDX_SUPABASE_PUBLISHABLE_KEY:?GitHub environment variable is required}"
          : "${MDX_PUBLIC_HOST_URL:?GitHub environment variable is required}"
          : "${MDX_APP_STORE_CONNECT_KEY_ID:?GitHub environment secret is required}"
          : "${MDX_APP_STORE_CONNECT_ISSUER_ID:?GitHub environment secret is required}"

      - name: Import Apple signing certificates
        env:
          DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_DEVELOPMENT_CERTIFICATE_BASE64 }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          : "${DEVELOPMENT_CERTIFICATE_BASE64:?Apple Development certificate is required}"
          : "${DEVELOPMENT_CERTIFICATE_PASSWORD:?Apple Development certificate password is required}"
          : "${DISTRIBUTION_CERTIFICATE_BASE64:?Apple Distribution certificate is required}"
          : "${DISTRIBUTION_CERTIFICATE_PASSWORD:?Apple Distribution certificate password is required}"
          keychain="$RUNNER_TEMP/mdx-ios-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          development_certificate="$RUNNER_TEMP/mdx-ios-development.p12"
          distribution_certificate="$RUNNER_TEMP/mdx-ios-distribution.p12"
          echo "::add-mask::$keychain_password"
          echo "MDX_IOS_CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$DEVELOPMENT_CERTIFICATE_BASE64" | base64 -D > "$development_certificate"
          printf '%s' "$DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$distribution_certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$development_certificate" -k "$keychain" -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$distribution_certificate" -k "$keychain" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep "Apple Development"
          security find-identity -v -p codesigning "$keychain" | grep "Apple Distribution"

      - name: Install App Store provisioning profiles
        env:
          MDX_IOS_APP_PROFILE_BASE64: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE_BASE64 }}
          MDX_IOS_ACTIVITY_PROFILE_BASE64: ${{ secrets.APPLE_IOS_ACTIVITY_APP_STORE_PROFILE_BASE64 }}
          MDX_IOS_NOTIFICATIONS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_NOTIFICATIONS_APP_STORE_PROFILE_BASE64 }}
        run: |
          profile_cleanup_file="$RUNNER_TEMP/mdx-ios-installed-profiles.txt"
          echo "MDX_IOS_PROFILE_CLEANUP_FILE=$profile_cleanup_file" >> "$GITHUB_ENV"
          MDX_IOS_PROFILE_ENV_FILE="$GITHUB_ENV" \
          MDX_IOS_PROFILE_CLEANUP_FILE="$profile_cleanup_file" \
            apps/mdx-operator-ios/script/install_distribution_profiles.sh

      - name: Prepare App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          : "${API_KEY_BASE64:?App Store Connect API private key is required}"
          api_key="$RUNNER_TEMP/AuthKey_${MDX_APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$api_key"
          chmod 600 "$api_key"
          echo "MDX_APP_STORE_CONNECT_KEY_PATH=$api_key" >> "$GITHUB_ENV"

      - name: Build, sign, and upload
        run: apps/mdx-operator-ios/script/testflight.sh

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-testflight-${{ env.MDX_IOS_MARKETING_VERSION }}-${{ env.MDX_IOS_BUILD_NUMBER }}-evidence
          path: |
            .mdx-local/ios-distribution/signing-preflight.txt
            .mdx-local/ios-distribution/profile-evidence.json
            .mdx-local/ios-distribution/archive-evidence.json
            .mdx-local/ios-distribution/signed-entitlements.plist
            .mdx-local/ios-distribution/ExportOptions-TestFlight.resolved.plist
            .mdx-local/ios-distribution/MDxAnywhere.xcarchive/Info.plist
          if-no-files-found: error
          retention-days: 90

      - name: Release summary
        run: |
          echo "## iPhone beta uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`$MDX_IOS_MARKETING_VERSION ($MDX_IOS_BUILD_NUMBER)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Destination: App Store Connect TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: explicit App Store profiles for the app and both extensions" >> "$GITHUB_STEP_SUMMARY"
          echo "- External cohort eligible: yes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle: \`com.mdx.anywhere\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed executable SHA-256: \`$(plutil -extract signed_app_sha256 raw .mdx-local/ios-distribution/archive-evidence.json)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral signing material
        if: always()
        run: |
          if [[ -n "${MDX_IOS_CI_KEYCHAIN:-}" && -f "$MDX_IOS_CI_KEYCHAIN" ]]; then
            security delete-keychain "$MDX_IOS_CI_KEYCHAIN" || true
          fi
          if [[ -n "${MDX_IOS_PROFILE_CLEANUP_FILE:-}" && -f "$MDX_IOS_PROFILE_CLEANUP_FILE" ]]; then
            while IFS= read -r profile_path; do
              case "$profile_path" in
                "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision)
                  rm -f "$profile_path"
                  ;;
                *)
                  echo "Refusing to remove unexpected provisioning profile path: $profile_path" >&2
                  ;;
              esac
            done < "$MDX_IOS_PROFILE_CLEANUP_FILE"
            rm -f "$MDX_IOS_PROFILE_CLEANUP_FILE"
          fi
          rm -f "$RUNNER_TEMP"/mdx-ios-development.p12 "$RUNNER_TEMP"/mdx-ios-distribution.p12 "$RUNNER_TEMP"/AuthKey_*.p8
