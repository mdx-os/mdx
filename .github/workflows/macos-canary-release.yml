name: macOS Canary Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, for example 0.9.2
        required: true
        type: string
      build:
        description: Numeric build identifier, defaults to the workflow run number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-canary-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish canary
    runs-on: macos-26
    timeout-minutes: 45
    environment: mac-canary-release
    env:
      MDX_MARKETING_VERSION: ${{ inputs.version }}
      MDX_BUILD_VERSION: ${{ inputs.build || github.run_number }}
      MDX_SUPABASE_URL: ${{ vars.MDX_SUPABASE_URL }}
      MDX_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MDX_SUPABASE_PUBLISHABLE_KEY }}
      MDX_PUBLIC_HOST_URL: ${{ vars.MDX_PUBLIC_HOST_URL }}
      MDX_DISTRIBUTION_CHANNEL: canary
      MDX_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_EDDSA_PUBLIC_KEY }}
      MDX_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      MDX_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_RELEASE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_RELEASE_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.SUPABASE_RELEASE_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      SUPABASE_RELEASE_S3_ENDPOINT: ${{ vars.SUPABASE_RELEASE_S3_ENDPOINT }}
      SUPABASE_RELEASE_BUCKET: mdx-canary-releases
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Validate release inputs
        run: |
          [[ "$MDX_MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MDX_BUILD_VERSION" =~ ^[0-9]+$ ]]
          : "${MDX_SUPABASE_URL:?GitHub environment variable is required}"
          : "${MDX_SUPABASE_PUBLISHABLE_KEY:?GitHub environment variable is required}"
          : "${MDX_PUBLIC_HOST_URL:?GitHub environment variable is required}"
          : "${MDX_SPARKLE_PUBLIC_KEY:?Sparkle EdDSA public key variable is required}"
          [[ "$MDX_SPARKLE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]
          : "${MDX_NOTARY_KEY_ID:?GitHub environment secret is required}"
          : "${MDX_NOTARY_ISSUER_ID:?GitHub environment secret is required}"
          : "${AWS_ACCESS_KEY_ID:?GitHub environment secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?GitHub environment secret is required}"
          : "${AWS_DEFAULT_REGION:?GitHub environment variable is required}"
          : "${SUPABASE_RELEASE_S3_ENDPOINT:?GitHub environment variable is required}"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          : "${CERTIFICATE_BASE64:?Developer ID certificate is required}"
          keychain="$RUNNER_TEMP/mdx-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/mdx-developer-id.p12"
          echo "::add-mask::$keychain_password"
          echo "MDX_CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          echo "MDX_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect notary key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          : "${NOTARY_KEY_BASE64:?App Store Connect API private key is required}"
          notary_key="$RUNNER_TEMP/AuthKey_${MDX_NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$notary_key"
          echo "MDX_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"

      - name: Prepare Sparkle update signing key
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY_BASE64 }}
        run: |
          : "${SPARKLE_PRIVATE_KEY_BASE64:?Sparkle EdDSA private key is required}"
          sparkle_key="$RUNNER_TEMP/mdx-sparkle-eddsa-private-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | base64 -D > "$sparkle_key"
          chmod 600 "$sparkle_key"
          test -s "$sparkle_key"
          echo "MDX_SPARKLE_PRIVATE_KEY_PATH=$sparkle_key" >> "$GITHUB_ENV"

      - name: Build cloud-configured app
        working-directory: apps/mdx-operator-macos
        run: script/package_release.sh

      - name: Sign and notarize
        working-directory: apps/mdx-operator-macos
        run: script/notarize.sh

      - name: Install AWS CLI when absent
        run: command -v aws >/dev/null 2>&1 || brew install awscli

      - name: Publish private canary
        working-directory: apps/mdx-operator-macos
        run: |
          aws configure set default.s3.addressing_style path
          versioned="releases/macos/canary/$MDX_MARKETING_VERSION/$MDX_BUILD_VERSION"
          aws s3 cp dist/MDx.zip "s3://$SUPABASE_RELEASE_BUCKET/$versioned/MDx.zip" --endpoint-url "$SUPABASE_RELEASE_S3_ENDPOINT" --content-type application/zip --no-progress
          aws s3 cp dist/MDx.dmg "s3://$SUPABASE_RELEASE_BUCKET/$versioned/MDx.dmg" --endpoint-url "$SUPABASE_RELEASE_S3_ENDPOINT" --content-type application/x-apple-diskimage --no-progress
          aws s3 cp dist/manifest.json "s3://$SUPABASE_RELEASE_BUCKET/$versioned/manifest.json" --endpoint-url "$SUPABASE_RELEASE_S3_ENDPOINT" --content-type application/json --no-progress
          aws s3 cp dist/MDx.zip "s3://$SUPABASE_RELEASE_BUCKET/latest/MDx.zip" --endpoint-url "$SUPABASE_RELEASE_S3_ENDPOINT" --content-type application/zip --no-progress
          aws s3 cp dist/MDx.dmg "s3://$SUPABASE_RELEASE_BUCKET/latest/MDx.dmg" --endpoint-url "$SUPABASE_RELEASE_S3_ENDPOINT" --content-type application/x-apple-diskimage --no-progress
          aws s3 cp dist/manifest.json "s3://$SUPABASE_RELEASE_BUCKET/latest/manifest.json" --endpoint-url "$SUPABASE_RELEASE_S3_ENDPOINT" --content-type application/json --no-progress

      - name: Upload notarization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-canary-${{ env.MDX_MARKETING_VERSION }}-${{ env.MDX_BUILD_VERSION }}-evidence
          path: |
            apps/mdx-operator-macos/dist/manifest.json
            apps/mdx-operator-macos/dist/notary-submission.json
            apps/mdx-operator-macos/dist/notary-log.json
            apps/mdx-operator-macos/dist/dmg-notary-submission.json
            apps/mdx-operator-macos/dist/dmg-notary-log.json
            apps/mdx-operator-macos/dist/signed-entitlements.plist
          if-no-files-found: error
          retention-days: 90

      - name: Release summary
        run: |
          echo "## macOS canary published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`$MDX_MARKETING_VERSION ($MDX_BUILD_VERSION)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: private Supabase Storage bucket \`$SUPABASE_RELEASE_BUCKET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download gate: \`$MDX_PUBLIC_HOST_URL/download/macos\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- First-install format: signed and notarized DMG" >> "$GITHUB_STEP_SUMMARY"
          echo "- In-app update channel: authenticated Sparkle appcast" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sparkle ZIP SHA-256: \`$(plutil -extract sha256 raw apps/mdx-operator-macos/dist/manifest.json)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installer DMG SHA-256: \`$(plutil -extract dmg_sha256 raw apps/mdx-operator-macos/dist/manifest.json)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral signing material
        if: always()
        run: |
          if [[ -n "${MDX_CI_KEYCHAIN:-}" && -f "$MDX_CI_KEYCHAIN" ]]; then
            security delete-keychain "$MDX_CI_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/mdx-developer-id.p12 "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/mdx-sparkle-eddsa-private-key
