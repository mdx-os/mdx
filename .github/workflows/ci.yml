name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-runtime:
    name: Web and Rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Check repository setup contract
        run: make setup-path-check

      - name: Build and smoke test the web app
        run: make web-build web-smoke

      - name: Check the Rust workspace
        run: make rust-check

      - name: Check package posture
        run: make package-posture-check

      - name: Check committed history for secrets
        run: make secret-history-check

  apple-clients:
    name: Apple clients
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test macOS app
        run: make macos-check

      - name: Build iOS app for the simulator
        run: make ios-build-check
