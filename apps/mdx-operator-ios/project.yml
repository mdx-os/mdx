name: MDxAnywhere
options:
  bundleIdPrefix: com.mdx
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
packages:
  MDxOperatorShared:
    path: ../mdx-operator-shared
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.46.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.9.2
    CODE_SIGN_STYLE: Automatic
targets:
  MDxAnywhere:
    type: application
    platform: iOS
    sources:
      - Sources/MDxAnywhere
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: MDxOperatorShared
      - package: Supabase
      - target: MDxAnywhereNotifications
        embed: true
      - target: MDxAnywhereActivity
        embed: true
    info:
      path: Support/MDxAnywhere-Info.plist
      properties:
        CFBundleDisplayName: MDx
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MDXSupabaseURL: $(MDX_SUPABASE_URL)
        MDXSupabasePublishableKey: $(MDX_SUPABASE_PUBLISHABLE_KEY)
        MDXPublicHostURL: $(MDX_PUBLIC_HOST_URL)
        NSCameraUsageDescription: Scan the one-time code shown by MDx on your Mac.
        NSFaceIDUsageDescription: Confirm bounded Forge decisions without opening broader authority.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.mdx.anywhere.github-installation
            CFBundleURLSchemes:
              - mdx
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdx.anywhere
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Support/MDxAnywhere.entitlements
        APS_ENVIRONMENT: development
        APP_ATTEST_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          APS_ENVIRONMENT: production
          APP_ATTEST_ENVIRONMENT: production
          MDX_PUBLIC_HOST_URL: https://mdx-beta-staging-host.onrender.com
  MDxAnywhereNotifications:
    type: app-extension
    platform: iOS
    sources:
      - Sources/MDxAnywhereNotifications
    info:
      path: Support/MDxAnywhereNotifications-Info.plist
      properties:
        CFBundleDisplayName: MDx Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdx.anywhere.notifications
        SKIP_INSTALL: true
  MDxAnywhereActivity:
    type: app-extension
    platform: iOS
    sources:
      - Sources/MDxAnywhereActivity
    dependencies:
      - package: MDxOperatorShared
    info:
      path: Support/MDxAnywhereActivity-Info.plist
      properties:
        CFBundleDisplayName: MDx Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdx.anywhere.activity
        SKIP_INSTALL: true
  MDxAnywhereTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MDxAnywhereTests
    dependencies:
      - target: MDxAnywhere
      - package: MDxOperatorShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdx.anywhere.tests
  MDxAnywhereUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/MDxAnywhereUITests
    dependencies:
      - target: MDxAnywhere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdx.anywhere.ui-tests
schemes:
  MDxAnywhere:
    build:
      targets:
        MDxAnywhere: all
        MDxAnywhereNotifications: all
        MDxAnywhereActivity: all
    test:
      targets:
        - MDxAnywhereTests
        - MDxAnywhereUITests
